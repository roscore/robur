[package]
name = "grip_ocr"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
eframe = { version = "0.35.0", optional = true }
egui_plot = { version = "0.36.0", optional = true }
# ponytail: jpeg only (zune-jpeg, pure Rust) — MJPEG camera frames + recording
image = { version = "0.25.10", optional = true, default-features = false, features = ["jpeg"] }
# ponytail: no default "decoding" (mozjpeg needs nasm); we decode MJPEG via `image`
nokhwa = { version = "0.10.11", optional = true, default-features = false, features = ["input-native"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"], optional = true }

[features]
default = ["app"]
app = ["dep:eframe", "dep:egui_plot", "dep:image", "dep:nokhwa", "dep:chrono"]

[[bin]]
name = "grip_ocr"
path = "src/main.rs"
required-features = ["app"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
